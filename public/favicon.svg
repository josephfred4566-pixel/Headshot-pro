<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <defs>
    <radialGradient id="favApertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFA000" stopOpacity="1" />
      <stop offset="60%" stopColor="#F59E0B" stopOpacity="1" />
      <stop offset="100%" stopColor="#D97706" stopOpacity="1" />
    </radialGradient>
    <linearGradient id="favBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
  </defs>

  {/* Background rect for high contrast favicon */}
  <rect width="240" height="160" rx="24" fill="#121212" />

  {/* 4 Viewfinder Corner Brackets */}
  <path d="M 28 42 L 28 22 L 48 22" stroke="url(#favBracketGrad)" strokeWidth="8" strokeLinecap="square" />
  <path d="M 212 42 L 212 22 L 192 22" stroke="url(#favBracketGrad)" strokeWidth="8" strokeLinecap="square" />
  <path d="M 28 118 L 28 138 L 48 138" stroke="url(#favBracketGrad)" strokeWidth="8" strokeLinecap="square" />
  <path d="M 212 118 L 212 138 L 192 138" stroke="url(#favBracketGrad)" strokeWidth="8" strokeLinecap="square" />

  {/* Outer Stylized Eye Outline */}
  <path d="M 32 80 C 65 34 175 34 208 80 C 175 126 65 126 32 80 Z" stroke="#F59E0B" strokeWidth="7" strokeLinejoin="round" fill="none" />

  {/* Shutter / Iris Outer Circle */}
  <circle cx="120" cy="80" r="38" fill="#18181b" stroke="#F59E0B" strokeWidth="5" />

  {/* Iris Diaphragm Shutter Blades */}
  <g stroke="#18181b" strokeWidth="3" strokeLinejoin="round">
    <path d="M 120 44 C 132 44 148 54 154 66 L 129 73 Z" fill="url(#favApertureGlow)" />
    <path d="M 154 66 C 158 76 156 94 148 106 L 129 88 Z" fill="url(#favApertureGlow)" />
    <path d="M 148 106 C 138 114 122 116 110 114 L 119 90 Z" fill="url(#favApertureGlow)" />
    <path d="M 110 114 C 98 112 88 102 86 92 L 110 86 Z" fill="url(#favApertureGlow)" />
    <path d="M 86 92 C 84 80 88 64 96 54 L 112 72 Z" fill="url(#favApertureGlow)" />
    <path d="M 96 54 C 104 46 114 44 120 44 L 122 70 Z" fill="url(#favApertureGlow)" />
  </g>

  {/* Center Hexagonal Dark Aperture Hole */}
  <polygon points="120,70 129,75 129,85 120,90 111,85 111,75" fill="#121212" stroke="#F59E0B" strokeWidth="2" />
  <circle cx="116" cy="76" r="3" fill="#FFFFFF" opacity="0.9" />
</svg>
